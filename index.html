<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>財富原點</title>
    <!-- Google Fonts for cute aesthetic -->
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #fdf6f5;
            --primary: #ffb7b2;
            --secondary: #e2f0cb;
            --accent: #b5ead7;
            --text-main: #5c4d5c;
            --text-light: #8e7f8e;
            --card-bg: #ffffff;
            --shadow: 0 8px 24px rgba(255, 183, 178, 0.2);
            --border-radius-lg: 24px;
            --border-radius-md: 16px;
            --border-radius-sm: 12px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Nunito', sans-serif;
            user-select: none;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        #app {
            width: 100%;
            max-width: 414px;
            height: 100%;
            max-height: 896px;
            background-color: var(--bg-color);
            position: relative;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 0 20px rgba(0,0,0,0.05);
            display: none; /* hidden until login */
        }

        /* Login Screen */
        #login-screen {
            width: 100%;
            max-width: 414px;
            height: 100%;
            max-height: 896px;
            background-color: var(--bg-color);
            position: absolute;
            z-index: 200;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 40px;
            text-align: center;
            box-shadow: 0 0 20px rgba(0,0,0,0.05);
        }

        .login-title {
            font-size: 32px;
            font-weight: 900;
            color: var(--primary);
            margin-bottom: 20px;
            text-shadow: 2px 2px 0px rgba(255, 183, 178, 0.3);
        }

        .login-char {
            font-size: 100px;
            margin-bottom: 40px;
            animation: bounce 2s infinite ease-in-out;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }

        .input-field {
            width: 100%;
            padding: 15px 20px;
            border: 2px solid var(--secondary);
            border-radius: var(--border-radius-md);
            font-size: 18px;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 20px;
            outline: none;
            transition: border-color 0.2s;
            text-align: center;
        }

        .input-field:focus {
            border-color: var(--primary);
        }

        .btn-primary {
            background: var(--primary);
            color: white;
            border: none;
            padding: 15px 40px;
            border-radius: var(--border-radius-md);
            font-size: 18px;
            font-weight: 900;
            cursor: pointer;
            box-shadow: var(--shadow);
            transition: transform 0.1s;
            width: 100%;
        }

        .btn-primary:active {
            transform: scale(0.95);
        }

        /* Top Status Bar */
        .status-bar {
            padding: 20px;
            background: var(--card-bg);
            border-bottom-left-radius: var(--border-radius-lg);
            border-bottom-right-radius: var(--border-radius-lg);
            box-shadow: var(--shadow);
            z-index: 10;
        }
        
        .status-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .player-info {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .level-badge {
            background: var(--primary);
            color: white;
            font-weight: 900;
            padding: 4px 10px;
            border-radius: var(--border-radius-sm);
            font-size: 14px;
        }

        .player-title {
            font-size: 14px;
            font-weight: 700;
            color: var(--text-light);
            max-width: 130px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .coins {
            display: flex;
            align-items: center;
            gap: 4px;
            font-weight: 900;
            font-size: 18px;
            color: #fca3b7;
        }

        .exp-container {
            background: #f0f0f0;
            height: 12px;
            border-radius: 6px;
            overflow: hidden;
            position: relative;
        }

        .exp-bar {
            height: 100%;
            background: linear-gradient(90deg, var(--accent), #9ce0c3);
            width: 0%;
            transition: width 0.3s ease;
        }
        
        .exp-text {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            text-align: center;
            font-size: 10px;
            line-height: 12px;
            font-weight: 900;
            color: var(--text-main);
        }

        /* Main Content Areas */
        .page {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            padding-bottom: 100px; /* Space for nav bar */
            display: none;
            animation: fadeIn 0.3s ease;
        }

        .page.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Home Page */
        .character-container {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 180px;
            background: linear-gradient(135deg, var(--secondary), var(--accent));
            border-radius: var(--border-radius-lg);
            box-shadow: var(--shadow);
            margin-bottom: 20px;
            font-size: 80px;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }

        /* Numpad Area */
        .accounting-area {
            background: var(--card-bg);
            border-radius: var(--border-radius-lg);
            padding: 20px;
            box-shadow: var(--shadow);
        }

        .amount-display {
            font-size: 36px;
            font-weight: 900;
            text-align: right;
            margin-bottom: 15px;
            color: var(--text-main);
            min-height: 50px;
            border-bottom: 2px dashed #f0f0f0;
            padding-bottom: 10px;
        }

        .categories {
            display: flex;
            justify-content: space-between;
            margin-bottom: 15px;
            overflow-x: auto;
            padding-bottom: 5px;
        }

        .cat-btn {
            background: var(--bg-color);
            border: none;
            border-radius: var(--border-radius-md);
            font-size: 24px;
            width: 50px;
            height: 50px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: transform 0.1s, background 0.2s;
        }

        .cat-btn.selected {
            background: var(--primary);
            transform: scale(1.1);
        }

        .numpad {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }

        .num-btn {
            background: var(--bg-color);
            border: none;
            border-radius: var(--border-radius-md);
            padding: 15px;
            font-size: 24px;
            font-weight: 700;
            color: var(--text-main);
            cursor: pointer;
            transition: background 0.1s;
        }

        .num-btn:active {
            background: #e8e8e8;
        }

        .btn-enter {
            background: var(--primary);
            color: white;
        }
        
        .btn-clear {
            background: #ffdbdb;
            color: #ff6b6b;
        }

        /* CSV Import */
        .csv-import {
            margin-top: 20px;
            text-align: right;
        }
        .csv-label {
            font-size: 12px;
            color: var(--text-light);
            cursor: pointer;
            text-decoration: underline;
        }
        #csv-input {
            display: none;
        }
        .invoice-list {
            margin-top: 15px;
        }
        .invoice-item {
            background: var(--card-bg);
            padding: 10px 15px;
            border-radius: var(--border-radius-sm);
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            font-size: 14px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.03);
        }

        /* Tasks Page */
        .task-card {
            background: var(--card-bg);
            border-radius: var(--border-radius-lg);
            padding: 20px;
            margin-bottom: 15px;
            box-shadow: var(--shadow);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .task-info h3 {
            font-size: 16px;
            margin-bottom: 4px;
        }
        .task-info p {
            font-size: 12px;
            color: var(--text-light);
        }
        .task-reward {
            font-weight: 900;
            color: #fca3b7;
            margin-bottom: 8px;
            font-size: 14px;
        }
        .btn-claim {
            background: var(--accent);
            color: var(--text-main);
            border: none;
            padding: 8px 16px;
            border-radius: var(--border-radius-sm);
            font-weight: 900;
            cursor: pointer;
        }
        .btn-claim:disabled {
            background: #f0f0f0;
            color: #aaa;
            cursor: not-allowed;
        }
        
        .task-status {
            font-size: 12px;
            font-weight: bold;
            text-align: center;
            background: #f0f0f0;
            color: #8e7f8e;
            padding: 8px 16px;
            border-radius: var(--border-radius-sm);
        }

        /* Offers Page */
        .offers-header {
            background: var(--card-bg);
            border-radius: var(--border-radius-lg);
            padding: 15px;
            margin-bottom: 20px;
            box-shadow: var(--shadow);
            text-align: center;
            font-weight: 900;
            font-size: 18px;
            color: var(--text-main);
        }
        
        #offers-coin-display {
            color: #fca3b7;
            font-size: 22px;
        }

        .offer-card {
            background: var(--card-bg);
            border-radius: var(--border-radius-lg);
            padding: 20px;
            margin-bottom: 15px;
            box-shadow: var(--shadow);
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .offer-icon {
            font-size: 40px;
            background: var(--secondary);
            width: 60px;
            height: 60px;
            border-radius: var(--border-radius-md);
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .offer-details {
            flex: 1;
        }
        .offer-details h3 {
            font-size: 16px;
        }
        .btn-redeem {
            background: var(--primary);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: var(--border-radius-sm);
            font-weight: 900;
            cursor: pointer;
        }

        /* Bottom Nav */
        .nav-bar {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 80px;
            background: var(--card-bg);
            border-top-left-radius: var(--border-radius-lg);
            border-top-right-radius: var(--border-radius-lg);
            box-shadow: 0 -4px 20px rgba(0,0,0,0.05);
            display: flex;
            justify-content: space-around;
            align-items: center;
            z-index: 10;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            color: var(--text-light);
            cursor: pointer;
            transition: color 0.2s;
            flex: 1;
        }

        .nav-item.active {
            color: var(--primary);
        }

        .nav-icon {
            font-size: 24px;
        }

        .nav-text {
            font-size: 12px;
            font-weight: 700;
        }

        /* Modal Overlay */
        .modal-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(5px);
            z-index: 100;
            display: none;
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background: var(--card-bg);
            width: 85%;
            border-radius: var(--border-radius-lg);
            padding: 30px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
        }

        @keyframes popIn {
            from { transform: scale(0.8); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .modal-title {
            font-size: 20px;
            margin-bottom: 20px;
            color: var(--primary);
        }

        #qrcode {
            display: flex;
            justify-content: center;
            margin-bottom: 20px;
            padding: 10px;
            background: white;
            border-radius: 10px;
            border: 2px dashed var(--secondary);
            overflow: hidden;
        }

        .timer {
            font-size: 32px;
            font-weight: 900;
            color: #ff6b6b;
            margin-bottom: 20px;
            font-variant-numeric: tabular-nums;
        }

        .btn-close {
            background: var(--text-light);
            color: white;
            border: none;
            padding: 10px 30px;
            border-radius: var(--border-radius-md);
            font-size: 16px;
            font-weight: 900;
            cursor: pointer;
        }

        /* Toast */
        .toast {
            position: absolute;
            top: 100px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--text-main);
            color: white;
            padding: 10px 20px;
            border-radius: 20px;
            font-weight: 700;
            font-size: 14px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
            z-index: 50;
        }

    </style>
</head>
<body>

    <!-- Login Screen -->
    <div id="login-screen">
        <div class="login-char">🧸</div>
        <div class="login-title">財富原點</div>
        <input type="text" id="username-input" class="input-field" placeholder="請輸入你的暱稱" autocomplete="off">
        <button class="btn-primary" onclick="login()">開始記帳</button>
    </div>

    <!-- Main App -->
    <div id="app">
        <!-- Top Status Bar -->
        <div class="status-bar">
            <div class="status-top">
                <div class="player-info">
                    <span class="level-badge" id="level-display">LV.1</span>
                    <span class="player-title" id="title-display">新手記帳員</span>
                </div>
                <div class="coins">
                    🪙 <span id="coin-display">100</span>
                </div>
            </div>
            <div class="exp-container">
                <div class="exp-bar" id="exp-bar"></div>
                <div class="exp-text" id="exp-text">0 / 100 XP</div>
            </div>
        </div>

        <!-- Toast -->
        <div class="toast" id="toast"></div>

        <!-- Page 1: Home / Accounting -->
        <div id="page-home" class="page active">
            <div class="character-container">
                🦖
            </div>

            <div class="accounting-area">
                <div class="amount-display">$<span id="amount-input">0</span></div>
                
                <div class="categories" id="category-container">
                    <button class="cat-btn selected" onclick="selectCat(this, '🍔')">🍔</button>
                    <button class="cat-btn" onclick="selectCat(this, '🧋')">🧋</button>
                    <button class="cat-btn" onclick="selectCat(this, '🚌')">🚌</button>
                    <button class="cat-btn" onclick="selectCat(this, '🎮')">🎮</button>
                    <button class="cat-btn" onclick="selectCat(this, '🛍️')">🛍️</button>
                </div>

                <div class="numpad">
                    <button class="num-btn" onclick="inputNum('1')">1</button>
                    <button class="num-btn" onclick="inputNum('2')">2</button>
                    <button class="num-btn" onclick="inputNum('3')">3</button>
                    <button class="num-btn" onclick="inputNum('4')">4</button>
                    <button class="num-btn" onclick="inputNum('5')">5</button>
                    <button class="num-btn" onclick="inputNum('6')">6</button>
                    <button class="num-btn" onclick="inputNum('7')">7</button>
                    <button class="num-btn" onclick="inputNum('8')">8</button>
                    <button class="num-btn" onclick="inputNum('9')">9</button>
                    <button class="num-btn btn-clear" onclick="inputNum('C')">C</button>
                    <button class="num-btn" onclick="inputNum('0')">0</button>
                    <button class="num-btn btn-enter" onclick="inputNum('Enter')">↵</button>
                </div>
            </div>

            <div class="csv-import">
                <label for="csv-input" class="csv-label">🧾 測試載入載具 CSV</label>
                <input type="file" id="csv-input" accept=".csv">
            </div>
            
            <div class="invoice-list" id="invoice-list">
                <!-- Invoices rendered here -->
            </div>
        </div>

        <!-- Page 2: Tasks -->
        <div id="page-tasks" class="page">
            <div id="task-list">
                <!-- Tasks rendered here -->
            </div>
        </div>

        <!-- Page 3: Offers -->
        <div id="page-offers" class="page">
            <div class="offers-header">
                💰 目前金幣：<span id="offers-coin-display">100</span>
            </div>
            <div id="offer-list">
                <!-- Offers rendered here -->
            </div>
        </div>

        <!-- Bottom Nav -->
        <div class="nav-bar">
            <div class="nav-item active" onclick="switchPage('home', this)">
                <span class="nav-icon">🏠</span>
                <span class="nav-text">首頁/記帳</span>
            </div>
            <div class="nav-item" onclick="switchPage('tasks', this)">
                <span class="nav-icon">📜</span>
                <span class="nav-text">任務</span>
            </div>
            <div class="nav-item" onclick="switchPage('offers', this)">
                <span class="nav-icon">🎁</span>
                <span class="nav-text">優惠</span>
            </div>
        </div>

        <!-- Coupon Modal -->
        <div class="modal-overlay" id="coupon-modal">
            <div class="modal-content">
                <h2 class="modal-title" id="modal-coupon-title">50嵐 9折券</h2>
                <div id="qrcode"></div>
                <div class="timer" id="modal-timer">03:00</div>
                <button class="btn-close" onclick="closeModal()">關閉</button>
            </div>
        </div>

    </div>

    <script>
        // Default Data
        const defaultState = {
            level: 1,
            exp: 0,
            coins: 100,
            lastAccountingDate: null,
            consecutiveDays: 0,
            tasks: [
                { id: 1, title: '早鳥任務', desc: '早上 9 點前完成第一筆記帳', reward: 20, exp: 50, completed: false, claimed: false },
                { id: 2, title: '離峰時段消費', desc: '於下午 2 點至 4 點間記帳', reward: 15, exp: 40, completed: false, claimed: false },
                { id: 3, title: '連續記帳 3 天', desc: '培養記帳好習慣', reward: 50, exp: 100, completed: false, claimed: false }
            ],
            offers: [
                { id: 1, icon: '🧋', title: '50嵐 9折券', cost: 150, code: '50LAN_DISCOUNT' },
                { id: 2, icon: '🍔', title: '麥當勞 大薯買一送一', cost: 300, code: 'MCD_FRIES' },
                { id: 3, icon: '☕', title: '星巴克 升級大杯券', cost: 250, code: 'STARBUCKS_UPGRADE' },
                { id: 4, icon: '🎟️', title: '電影票 8折券', cost: 500, code: 'MOVIE_DISCOUNT' }
            ]
        };

        let state = null;
        let currentUser = null;

        const titles = ["新手記帳員", "理財小能手", "省錢達人", "財富領航者", "財富原點大師"];
        const EXP_PER_LEVEL = 100;
        
        let currentAmount = "0";
        let currentCat = "🍔";
        let timerInterval = null;

        // Init
        function init() {
            // Wait for user to login
            document.getElementById('username-input').addEventListener('keypress', function (e) {
                if (e.key === 'Enter') {
                    login();
                }
            });
        }

        function login() {
            const username = document.getElementById('username-input').value.trim();
            if (!username) {
                showToast("請輸入暱稱！");
                return;
            }
            currentUser = username;
            
            const saved = localStorage.getItem(`wealth_origin_state_${currentUser}`);
            if (saved) {
                state = JSON.parse(saved);
                // Ensure new fields exist for old saves
                if (state.lastAccountingDate === undefined) state.lastAccountingDate = null;
                if (state.consecutiveDays === undefined) state.consecutiveDays = 0;
                if (!state.tasks) state.tasks = JSON.parse(JSON.stringify(defaultState.tasks));
                state.tasks.forEach(t => {
                    if (t.completed === undefined) t.completed = false;
                });
            } else {
                state = JSON.parse(JSON.stringify(defaultState));
            }

            // Hide login, show app
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('app').style.display = 'flex';
            
            updateUI();
            renderTasks();
            renderOffers();
            
            document.getElementById('csv-input').addEventListener('change', handleCSV);
        }

        function saveState() {
            if (currentUser && state) {
                localStorage.setItem(`wealth_origin_state_${currentUser}`, JSON.stringify(state));
            }
            updateUI();
        }

        function updateUI() {
            // Level & EXP
            let currentLevelReq = state.level * EXP_PER_LEVEL;
            while (state.exp >= currentLevelReq) {
                state.level++;
                state.exp -= currentLevelReq;
                currentLevelReq = state.level * EXP_PER_LEVEL;
                showToast(`🎉 升級到 LV.${state.level}！`);
            }
            
            document.getElementById('level-display').innerText = `LV.${state.level}`;
            
            // Title
            let titleIdx = Math.min(Math.floor((state.level - 1) / 2), titles.length - 1);
            document.getElementById('title-display').innerText = `${currentUser} (${titles[titleIdx]})`;

            // Coins
            document.getElementById('coin-display').innerText = state.coins;
            document.getElementById('offers-coin-display').innerText = state.coins;

            // Exp bar
            let expPercent = (state.exp / currentLevelReq) * 100;
            document.getElementById('exp-bar').style.width = `${expPercent}%`;
            document.getElementById('exp-text').innerText = `${state.exp} / ${currentLevelReq} XP`;
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.innerText = msg;
            toast.style.opacity = 1;
            setTimeout(() => {
                toast.style.opacity = 0;
            }, 2000);
        }

        // Navigation
        function switchPage(pageId, navItem) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById(`page-${pageId}`).classList.add('active');
            
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            navItem.classList.add('active');
        }

        // Numpad & Accounting
        function selectCat(btn, cat) {
            document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('selected'));
            btn.classList.add('selected');
            currentCat = cat;
        }

        function inputNum(val) {
            if (val === 'C') {
                currentAmount = "0";
            } else if (val === 'Enter') {
                if (currentAmount === "0") {
                    showToast('金額不能為 0 哦！');
                    return;
                }
                
                checkTasksRealtime();

                let amt = parseInt(currentAmount, 10);
                state.coins += 5;
                state.exp += 15;
                showToast(`✅ 記帳成功！獲得 5 🪙, 15 XP`);
                saveState();
                currentAmount = "0";
            } else {
                if (currentAmount === "0") {
                    currentAmount = val;
                } else {
                    if (currentAmount.length < 7) {
                        currentAmount += val;
                    }
                }
            }
            document.getElementById('amount-input').innerText = currentAmount;
        }

        // Task Verification Logic
        function checkTasksRealtime() {
            const now = new Date();
            const hour = now.getHours();
            const todayStr = now.toISOString().split('T')[0]; // YYYY-MM-DD
            let tasksChanged = false;

            // Task 1: 早鳥任務 (Before 9 AM)
            let task1 = state.tasks.find(t => t.id === 1);
            if (task1 && !task1.completed && hour < 9) {
                task1.completed = true;
                tasksChanged = true;
                showToast(`🌟 達成早鳥任務！去任務頁領獎吧！`);
            }

            // Task 2: 離峰時段消費 (14:00 to 15:59)
            let task2 = state.tasks.find(t => t.id === 2);
            if (task2 && !task2.completed && hour >= 14 && hour < 16) {
                task2.completed = true;
                tasksChanged = true;
                showToast(`🌟 達成離峰時段任務！去任務頁領獎吧！`);
            }

            // Task 3: 連續記帳 3 天
            let task3 = state.tasks.find(t => t.id === 3);
            if (task3 && !task3.completed) {
                if (state.lastAccountingDate !== todayStr) {
                    if (!state.lastAccountingDate) {
                        state.consecutiveDays = 1;
                    } else {
                        const lastDate = new Date(state.lastAccountingDate);
                        lastDate.setDate(lastDate.getDate() + 1);
                        const expectedStr = lastDate.toISOString().split('T')[0];
                        if (todayStr === expectedStr) {
                            state.consecutiveDays += 1;
                        } else {
                            // Reset if skipped a day
                            state.consecutiveDays = 1;
                        }
                    }
                    state.lastAccountingDate = todayStr;
                    
                    if (state.consecutiveDays >= 3) {
                        task3.completed = true;
                        tasksChanged = true;
                        showToast(`🌟 達成連續記帳3天任務！去任務頁領獎吧！`);
                    }
                }
            }

            if (tasksChanged) {
                renderTasks();
            }
        }

        // CSV Import
        function handleCSV(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(event) {
                const text = event.target.result;
                const rows = text.split('\n').filter(r => r.trim() !== '');
                
                const listEl = document.getElementById('invoice-list');
                listEl.innerHTML = '';
                
                let count = 0;
                for(let i=1; i<Math.min(rows.length, 6); i++) {
                    let cols = rows[i].split(',');
                    if (cols.length >= 3) {
                        let date = cols[0].trim();
                        let store = cols[1].trim();
                        let amt = cols[2].trim();
                        
                        let item = document.createElement('div');
                        item.className = 'invoice-item';
                        item.innerHTML = `<span>📅 ${date} - ${store}</span> <span>$${amt}</span>`;
                        listEl.appendChild(item);
                        count++;
                    }
                }
                
                if(count > 0) {
                    showToast(`🧾 成功匯入 ${count} 筆載具明細！`);
                    state.coins += 20;
                    state.exp += 50;
                    saveState();
                }
            };
            reader.readAsText(file);
        }

        // Tasks
        function renderTasks() {
            const listEl = document.getElementById('task-list');
            listEl.innerHTML = '';
            state.tasks.forEach(t => {
                const card = document.createElement('div');
                card.className = 'task-card';
                
                let btnHTML = '';
                if (t.claimed) {
                    btnHTML = `<button class="btn-claim" disabled>已領取</button>`;
                } else if (t.completed) {
                    btnHTML = `<button class="btn-claim" onclick="claimTask(${t.id})">領取獎勵</button>`;
                } else {
                    btnHTML = `<div class="task-status">🔒 未達成</div>`;
                }

                card.innerHTML = `
                    <div class="task-info">
                        <h3>${t.title}</h3>
                        <p>${t.desc}</p>
                        <div class="task-reward">🎁 ${t.reward} 🪙 | ${t.exp} XP</div>
                    </div>
                    <div>
                        ${btnHTML}
                    </div>
                `;
                listEl.appendChild(card);
            });
        }

        function claimTask(id) {
            let task = state.tasks.find(t => t.id === id);
            if(task && task.completed && !task.claimed) {
                task.claimed = true;
                state.coins += task.reward;
                state.exp += task.exp;
                showToast(`🎉 獲得 ${task.reward} 🪙 及 ${task.exp} XP！`);
                saveState();
                renderTasks();
            }
        }

        // Offers
        function renderOffers() {
            const listEl = document.getElementById('offer-list');
            listEl.innerHTML = '';
            state.offers.forEach(o => {
                const card = document.createElement('div');
                card.className = 'offer-card';
                card.innerHTML = `
                    <div class="offer-icon">${o.icon}</div>
                    <div class="offer-details">
                        <h3>${o.title}</h3>
                        <p style="font-size:12px; color:#8e7f8e; margin-top:4px;">💰 ${o.cost} 🪙</p>
                    </div>
                    <button class="btn-redeem" onclick="redeemCoupon(${o.id})">兌換</button>
                `;
                listEl.appendChild(card);
            });
        }

        function redeemCoupon(id) {
            let offer = state.offers.find(o => o.id === id);
            if(state.coins >= offer.cost) {
                state.coins -= offer.cost; 
                saveState();
                openModal(offer);
            } else {
                showToast(`🪙 金幣不足！需要 ${offer.cost} 🪙`);
            }
        }

        // Modal & QR Code
        function openModal(offer) {
            document.getElementById('modal-coupon-title').innerText = offer.title;
            const modal = document.getElementById('coupon-modal');
            modal.style.display = 'flex';
            
            // Use the funny image provided by the user instead of dynamic QR code
            const qrContainer = document.getElementById('qrcode');
            qrContainer.innerHTML = '<img src="qrcode_image.jpg" alt="Funny Face" style="width: 180px; height: 180px; border-radius: 8px; object-fit: cover;">';

            // Start Timer
            let timeleft = 180; // 3 minutes
            updateTimerDisplay(timeleft);
            
            if(timerInterval) clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                timeleft--;
                if(timeleft <= 0) {
                    clearInterval(timerInterval);
                    closeModal();
                    showToast('⚠️ 優惠券已過期！');
                } else {
                    updateTimerDisplay(timeleft);
                }
            }, 1000);
        }

        function updateTimerDisplay(secs) {
            let m = Math.floor(secs / 60).toString().padStart(2, '0');
            let s = (secs % 60).toString().padStart(2, '0');
            document.getElementById('modal-timer').innerText = `${m}:${s}`;
        }

        function closeModal() {
            document.getElementById('coupon-modal').style.display = 'none';
            if(timerInterval) clearInterval(timerInterval);
            renderOffers();
        }

        // Boot
        window.onload = init;
    </script>
</body>
</html>

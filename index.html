<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>財富原點 - 史詩冒險</title>
    <!-- Include qrcode.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        :root {
            /* Dark Fantasy Theme Variables */
            --bg-dark: #0f111a;
            --panel-bg: rgba(25, 28, 41, 0.75);
            --panel-border: rgba(142, 140, 166, 0.3);
            --text-main: #e2e2e8;
            --text-gold: #ffcf54;
            --text-dim: #8b8996;
            --accent-blue: #4a90e2;
            --accent-purple: #9b59b6;
            --btn-bg: linear-gradient(145deg, #2a2d3e, #1f212d);
            --btn-border: #4d4f61;
            --btn-active: #151720;
            --shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5);
            --glass-blur: blur(12px);
            --radius-lg: 16px;
            --radius-md: 10px;
            --radius-sm: 6px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Georgia', serif; /* A bit more classic/RPG feel */
            user-select: none;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            position: relative;
        }

        /* Animated CSS Background */
        .stars {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: 
                radial-gradient(circle at 15% 50%, rgba(76, 39, 114, 0.3) 0%, transparent 50%),
                radial-gradient(circle at 85% 30%, rgba(38, 93, 148, 0.3) 0%, transparent 50%);
            z-index: 0;
            overflow: hidden;
        }

        .particle {
            position: absolute;
            width: 3px; height: 3px;
            background: #fff;
            border-radius: 50%;
            box-shadow: 0 0 10px #fff, 0 0 20px var(--text-gold);
            animation: float-up linear infinite;
        }

        @keyframes float-up {
            0% { transform: translateY(100vh) scale(0); opacity: 0; }
            50% { opacity: 0.8; }
            100% { transform: translateY(-20vh) scale(1); opacity: 0; }
        }

        /* App Container */
        #app {
            width: 100%;
            max-width: 414px;
            height: 100%;
            max-height: 896px;
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            background: transparent;
            display: none; /* Hidden until login */
        }

        /* Glassmorphism Panels */
        .glass-panel {
            background: var(--panel-bg);
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            border: 1px solid var(--panel-border);
            box-shadow: var(--shadow);
            border-radius: var(--radius-lg);
        }

        /* Status Bar */
        .status-bar {
            padding: 15px;
            margin: 10px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .status-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .player-info {
            display: flex;
            flex-direction: column;
        }

        .player-name {
            font-size: 16px;
            font-weight: bold;
            color: var(--text-gold);
            text-shadow: 0 0 5px rgba(255, 207, 84, 0.5);
        }

        .level-badge {
            font-size: 12px;
            color: var(--text-dim);
        }

        .currencies {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 4px;
        }

        .currency {
            display: flex;
            align-items: center;
            gap: 5px;
            font-weight: bold;
            font-size: 14px;
        }

        .coins { color: #f1c40f; }
        .gems { color: #e74c3c; }

        .exp-container {
            background: rgba(0, 0, 0, 0.5);
            height: 10px;
            border-radius: 5px;
            border: 1px solid #333;
            overflow: hidden;
            position: relative;
        }

        .exp-bar {
            height: 100%;
            background: linear-gradient(90deg, #2ecc71, #27ae60);
            width: 0%;
            transition: width 0.3s;
        }

        /* Pages */
        .page {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
            padding-bottom: 90px;
            display: none;
            animation: fadeIn 0.4s;
        }

        .page.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.98); }
            to { opacity: 1; transform: scale(1); }
        }

        /* --- Explore Page (Home) --- */
        
        /* Adventure Log */
        .adventure-log {
            height: 80px;
            margin-bottom: 15px;
            padding: 10px;
            overflow-y: hidden;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            position: relative;
        }
        
        .adventure-log::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; height: 20px;
            background: linear-gradient(to bottom, var(--panel-bg), transparent);
            z-index: 2;
        }

        .log-entry {
            font-size: 14px;
            line-height: 1.4;
            margin-top: 5px;
            animation: slideUpFade 0.5s forwards;
            opacity: 0;
            color: var(--text-dim);
        }
        
        .log-entry:last-child {
            color: var(--text-main);
            font-weight: bold;
        }

        .log-rare { color: var(--accent-purple); text-shadow: 0 0 5px var(--accent-purple); }
        .log-epic { color: var(--text-gold); text-shadow: 0 0 5px var(--text-gold); }

        @keyframes slideUpFade {
            from { transform: translateY(10px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        /* Numpad Area */
        .amount-display {
            font-size: 32px;
            text-align: right;
            padding: 10px;
            margin-bottom: 10px;
            border-bottom: 1px solid var(--btn-border);
            color: var(--text-gold);
            font-family: 'Courier New', Courier, monospace;
            text-shadow: 0 0 10px rgba(255, 207, 84, 0.3);
            min-height: 55px;
        }

        .categories {
            display: flex;
            justify-content: space-between;
            margin-bottom: 15px;
            overflow-x: auto;
            gap: 10px;
        }

        .cat-btn {
            background: var(--btn-bg);
            border: 1px solid var(--btn-border);
            border-radius: var(--radius-sm);
            font-size: 20px;
            width: 45px;
            height: 45px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        .cat-btn.selected {
            border-color: var(--text-gold);
            box-shadow: 0 0 10px rgba(255, 207, 84, 0.5);
            transform: translateY(-2px);
        }

        .numpad {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }

        .num-btn {
            background: var(--btn-bg);
            border: 1px solid var(--btn-border);
            border-radius: var(--radius-md);
            padding: 15px;
            font-size: 20px;
            color: var(--text-main);
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            text-shadow: 1px 1px 2px #000;
        }

        .num-btn:active {
            background: var(--btn-active);
            transform: translateY(2px);
            box-shadow: 0 1px 2px rgba(0,0,0,0.3);
        }

        .btn-enter {
            background: linear-gradient(145deg, #8e44ad, #9b59b6);
            border-color: #8e44ad;
            color: white;
            text-shadow: 0 0 5px rgba(255,255,255,0.5);
        }

        .btn-clear {
            color: #e74c3c;
        }
        
        /* History List */
        .section-title {
            font-size: 16px;
            color: var(--text-gold);
            margin: 20px 0 10px 0;
            border-bottom: 1px solid var(--btn-border);
            padding-bottom: 5px;
        }
        
        .history-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        
        .history-item {
            background: rgba(0,0,0,0.3);
            border: 1px solid var(--panel-border);
            padding: 10px;
            border-radius: var(--radius-sm);
            display: flex;
            justify-content: space-between;
            font-size: 14px;
        }

        /* --- Inventory Page (行囊) --- */
        .equipped-panel {
            text-align: center;
            padding: 20px;
            margin-bottom: 15px;
            border: 1px solid var(--text-gold);
            box-shadow: 0 0 15px rgba(255, 207, 84, 0.2) inset;
        }
        
        .equipped-icon {
            font-size: 40px;
            margin-bottom: 10px;
            filter: drop-shadow(0 0 10px var(--text-gold));
        }
        
        .inventory-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }
        
        .inv-item {
            background: rgba(0,0,0,0.4);
            border: 1px solid var(--btn-border);
            padding: 15px;
            border-radius: var(--radius-md);
            text-align: center;
            cursor: pointer;
        }
        
        .inv-item.equipped {
            border-color: var(--text-gold);
            background: rgba(255, 207, 84, 0.1);
        }
        
        .inv-btn {
            margin-top: 10px;
            width: 100%;
            padding: 5px;
            background: var(--btn-bg);
            border: 1px solid var(--btn-border);
            color: var(--text-main);
            border-radius: var(--radius-sm);
        }

        /* --- Tasks Page (任務) --- */
        .task-card {
            background: rgba(0,0,0,0.4);
            border: 1px solid var(--btn-border);
            padding: 15px;
            border-radius: var(--radius-md);
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .task-reward {
            color: #e74c3c; /* Gems color */
            font-size: 14px;
            margin-top: 5px;
        }

        .btn-claim {
            background: linear-gradient(145deg, #e67e22, #d35400);
            border: 1px solid #d35400;
            color: white;
            padding: 8px 15px;
            border-radius: var(--radius-sm);
            cursor: pointer;
            font-weight: bold;
        }

        .btn-claim:disabled {
            background: #333;
            border-color: #222;
            color: #777;
            cursor: not-allowed;
        }

        /* --- Market Page (市集) --- */
        .gacha-panel {
            text-align: center;
            padding: 30px 20px;
        }
        
        .gacha-altar {
            font-size: 80px;
            margin-bottom: 20px;
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0% { filter: drop-shadow(0 0 10px var(--accent-purple)); }
            50% { filter: drop-shadow(0 0 30px var(--accent-purple)); }
            100% { filter: drop-shadow(0 0 10px var(--accent-purple)); }
        }

        .btn-gacha {
            background: linear-gradient(145deg, #9b59b6, #8e44ad);
            border: 1px solid #9b59b6;
            color: white;
            padding: 15px 30px;
            font-size: 18px;
            border-radius: var(--radius-lg);
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(155, 89, 182, 0.5);
            width: 100%;
        }

        /* --- Temple Page (神殿) --- */
        .offer-card {
            background: rgba(0,0,0,0.4);
            border: 1px solid var(--btn-border);
            padding: 15px;
            border-radius: var(--radius-md);
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 15px;
        }
        
        .btn-redeem {
            background: linear-gradient(145deg, #c0392b, #e74c3c);
            border: 1px solid #c0392b;
            color: white;
            padding: 8px 15px;
            border-radius: var(--radius-sm);
            cursor: pointer;
            font-weight: bold;
        }

        /* Nav Bar */
        .nav-bar {
            position: absolute;
            bottom: 0; left: 0; width: 100%;
            height: 70px;
            background: var(--panel-bg);
            backdrop-filter: var(--glass-blur);
            border-top: 1px solid var(--panel-border);
            display: flex;
            justify-content: space-around;
            align-items: center;
            z-index: 10;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            color: var(--text-dim);
            cursor: pointer;
            transition: color 0.3s;
            flex: 1;
        }

        .nav-item.active {
            color: var(--text-gold);
            text-shadow: 0 0 10px rgba(255, 207, 84, 0.5);
        }

        .nav-icon { font-size: 20px; }
        .nav-text { font-size: 12px; }

        /* Modal */
        .modal-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(5px);
            z-index: 100;
            display: none;
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background: var(--panel-bg);
            border: 2px solid var(--text-gold);
            width: 85%;
            border-radius: var(--radius-lg);
            padding: 30px;
            text-align: center;
            box-shadow: 0 0 30px rgba(255, 207, 84, 0.2);
            animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes popIn {
            from { transform: scale(0.8); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        #qrcode {
            display: flex;
            justify-content: center;
            margin: 20px 0;
            padding: 15px;
            background: #fff;
            border-radius: 10px;
        }

        /* Toast */
        .toast {
            position: absolute;
            top: 120px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.8);
            border: 1px solid var(--panel-border);
            color: white;
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 14px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
            z-index: 50;
            white-space: nowrap;
        }

        /* Login Screen */
        #login-screen {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 200;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 30px;
        }

        .login-title {
            font-size: 36px;
            color: var(--text-gold);
            margin-bottom: 30px;
            text-shadow: 0 0 15px rgba(255,207,84,0.5);
        }

        .login-input {
            background: rgba(0,0,0,0.5);
            border: 1px solid var(--panel-border);
            color: white;
            padding: 15px;
            border-radius: var(--radius-md);
            margin-bottom: 20px;
            width: 100%;
            text-align: center;
            font-size: 18px;
        }
        
        .login-btn {
            background: linear-gradient(145deg, #27ae60, #2ecc71);
            border: 1px solid #27ae60;
            color: white;
            padding: 15px;
            width: 100%;
            border-radius: var(--radius-md);
            font-size: 18px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <!-- Animated Particles Background -->
    <div class="stars" id="stars-container"></div>

    <!-- Login Screen -->
    <div id="login-screen" class="glass-panel" style="background:transparent; border:none; box-shadow:none;">
        <div style="font-size: 80px; margin-bottom: 20px;">🐉</div>
        <div class="login-title">財富原點</div>
        <p style="color:var(--text-dim); margin-bottom: 20px;">締結冒險契約，開啟你的理財史詩</p>
        <input type="text" id="username-input" class="login-input" placeholder="冒險者，報上名來">
        <button class="login-btn" onclick="login()">踏入深淵</button>
    </div>

    <!-- Main App -->
    <div id="app">
        <!-- Top Status Bar -->
        <div class="status-bar glass-panel">
            <div class="status-top">
                <div class="player-info">
                    <span class="player-name" id="title-display">未知冒險者</span>
                    <span class="level-badge" id="level-display">LV.1 (0/100 XP)</span>
                </div>
                <div class="currencies">
                    <div class="currency coins">🪙 <span id="coin-display">0</span></div>
                    <div class="currency gems">💎 <span id="gem-display">0</span></div>
                </div>
            </div>
            <div class="exp-container">
                <div class="exp-bar" id="exp-bar"></div>
            </div>
        </div>

        <div class="toast" id="toast"></div>

        <!-- 1. 探索 (Home/Accounting) -->
        <div id="page-home" class="page active">
            <!-- Text Adventure Broadcast -->
            <div class="adventure-log glass-panel" id="adventure-log">
                <div class="log-entry">系統：歡迎來到財富原點，冒險即將展開...</div>
            </div>

            <!-- Numpad Area -->
            <div class="glass-panel" style="padding: 15px;">
                <div class="amount-display">$<span id="amount-input">0</span></div>
                
                <div class="categories">
                    <button class="cat-btn selected" onclick="selectCat(this, '🍖')">🍖</button>
                    <button class="cat-btn" onclick="selectCat(this, '🧪')">🧪</button>
                    <button class="cat-btn" onclick="selectCat(this, '🗡️')">🗡️</button>
                    <button class="cat-btn" onclick="selectCat(this, '🐎')">🐎</button>
                    <button class="cat-btn" onclick="selectCat(this, '📜')">📜</button>
                </div>

                <div class="numpad">
                    <button class="num-btn" onclick="inputNum('1')">1</button>
                    <button class="num-btn" onclick="inputNum('2')">2</button>
                    <button class="num-btn" onclick="inputNum('3')">3</button>
                    <button class="num-btn" onclick="inputNum('4')">4</button>
                    <button class="num-btn" onclick="inputNum('5')">5</button>
                    <button class="num-btn" onclick="inputNum('6')">6</button>
                    <button class="num-btn" onclick="inputNum('7')">7</button>
                    <button class="num-btn" onclick="inputNum('8')">8</button>
                    <button class="num-btn" onclick="inputNum('9')">9</button>
                    <button class="num-btn btn-clear" onclick="inputNum('C')">C</button>
                    <button class="num-btn" onclick="inputNum('0')">0</button>
                    <button class="num-btn btn-enter" onclick="inputNum('Enter')">斬擊!</button>
                </div>
            </div>
            
            <div class="section-title">冒險足跡 (歷史記帳)</div>
            <div class="history-list" id="history-list">
                <!-- History items -->
            </div>
        </div>

        <!-- 2. 行囊 (Inventory) -->
        <div id="page-inventory" class="page">
            <div class="equipped-panel glass-panel">
                <div style="color:var(--text-dim); font-size:12px; margin-bottom:5px;">目前裝備</div>
                <div class="equipped-icon" id="eq-icon">❓</div>
                <h3 id="eq-name">無裝備</h3>
                <p style="color:var(--text-gold); font-size:14px; margin-top:5px;" id="eq-bonus">加成：0%</p>
            </div>
            
            <div class="section-title">我的行囊</div>
            <div class="inventory-grid" id="inventory-list">
                <!-- Inventory items -->
            </div>
        </div>

        <!-- 3. 任務 (Tasks) -->
        <div id="page-tasks" class="page">
            <div class="section-title">每日試煉 (每日午夜重置)</div>
            <div id="task-list">
                <!-- Tasks -->
            </div>
        </div>

        <!-- 4. 市集 (Market/Gacha) -->
        <div id="page-market" class="page">
            <div class="gacha-panel glass-panel">
                <div class="gacha-altar">🔮</div>
                <h2 style="margin-bottom:10px; color:var(--text-gold);">命運之輪</h2>
                <p style="color:var(--text-dim); font-size:14px; margin-bottom:20px;">
                    向命運獻上 200 🪙，抽取強大的記帳神器！<br>
                    (有機會獲得高階加成裝備)
                </p>
                <button class="btn-gacha" onclick="drawGacha()">獻祭 200 🪙 進行抽取</button>
            </div>
        </div>

        <!-- 5. 神殿 (Temple/Offers) -->
        <div id="page-temple" class="page">
            <div class="section-title">神聖恩賜 (實體兌換)</div>
            <p style="color:var(--text-dim); font-size:12px; margin-bottom:15px;">消耗 💎 兌換點數以獲得現實中的獎勵。</p>
            <div id="offer-list">
                <!-- Offers -->
            </div>
        </div>

        <!-- Bottom Nav -->
        <div class="nav-bar">
            <div class="nav-item active" onclick="switchPage('home', this)">
                <span class="nav-icon">🗡️</span>
                <span class="nav-text">探索</span>
            </div>
            <div class="nav-item" onclick="switchPage('inventory', this)">
                <span class="nav-icon">🎒</span>
                <span class="nav-text">行囊</span>
            </div>
            <div class="nav-item" onclick="switchPage('tasks', this)">
                <span class="nav-icon">📜</span>
                <span class="nav-text">任務</span>
            </div>
            <div class="nav-item" onclick="switchPage('market', this)">
                <span class="nav-icon">🎪</span>
                <span class="nav-text">市集</span>
            </div>
            <div class="nav-item" onclick="switchPage('temple', this)">
                <span class="nav-icon">🏛️</span>
                <span class="nav-text">神殿</span>
            </div>
        </div>

        <!-- QR Modal -->
        <div class="modal-overlay" id="coupon-modal">
            <div class="modal-content">
                <h2 style="color:var(--text-gold); margin-bottom:10px;" id="modal-coupon-title">神聖恩賜</h2>
                <div id="qrcode"></div>
                <div style="font-size:32px; color:#e74c3c; font-weight:bold; margin-bottom:20px; font-family:monospace;" id="modal-timer">03:00</div>
                <button style="background:#333; color:white; border:1px solid #555; padding:10px 30px; border-radius:5px; cursor:pointer;" onclick="closeModal()">返回神殿</button>
            </div>
        </div>

    </div>

    <script>
        // Create background particles
        function createParticles() {
            const container = document.getElementById('stars-container');
            for(let i=0; i<30; i++) {
                let p = document.createElement('div');
                p.className = 'particle';
                p.style.left = Math.random() * 100 + 'vw';
                p.style.animationDuration = (Math.random() * 3 + 2) + 's';
                p.style.animationDelay = Math.random() * 2 + 's';
                container.appendChild(p);
            }
        }
        createParticles();

        // Data Definitions
        const GACHA_POOL = [
            { id: 101, name: '初級木算盤', icon: '🧮', bonus: 0.1, rarity: 'Normal' },
            { id: 102, name: '魔法記帳本', icon: '📓', bonus: 0.2, rarity: 'Rare' },
            { id: 103, name: '地精金庫', icon: '🏦', bonus: 0.35, rarity: 'Epic' },
            { id: 104, name: '真理計算機', icon: '🖩', bonus: 0.5, rarity: 'Legendary' }
        ];

        const EVENTS = [
            { text: "你在迷霧中推進，平靜無事。", type: "Normal" },
            { text: "發現一個遺落的錢袋，獲得額外 20 🪙！", type: "Good", coins: 20 },
            { text: "遭遇野生史萊姆！你用帳單擊退了牠，獲得 15 XP！", type: "Good", exp: 15 },
            { text: "踩到陷阱！幸好躲避及時，沒有損失。", type: "Normal" },
            { text: "遇見流浪商人，他被你的記帳習慣感動，贈送 50 🪙！", type: "Epic", coins: 50 }
        ];

        const defaultState = {
            level: 1,
            exp: 0,
            coins: 100, // 🪙
            gems: 0,    // 💎
            lastLoginDate: null,
            entriesToday: 0,
            history: [],
            inventory: [], // Store item IDs
            equippedId: null,
            tasks: [
                { id: 1, title: '每日簽到', desc: '新的一天，新的冒險', rewardGems: 10, completed: false, claimed: false },
                { id: 2, title: '勤勉記帳', desc: '單日完成 3 筆記帳', rewardGems: 20, completed: false, claimed: false }
            ],
            offers: [
                { id: 1, icon: '🧋', title: '50嵐 9折券', cost: 100, code: '50LAN' },
                { id: 2, icon: '🍔', title: '麥當勞 買一送一', cost: 250, code: 'MCD' },
                { id: 3, icon: '🎟️', title: '電影票 8折券', cost: 500, code: 'MOVIE' }
            ]
        };

        let state = null;
        let currentUser = null;
        let currentAmount = "0";
        let currentCat = "🍖";
        let timerInterval = null;
        
        const EXP_PER_LEVEL = 100;

        // Init App
        function login() {
            const username = document.getElementById('username-input').value.trim();
            if (!username) {
                showToast("請輸入你的名號！");
                return;
            }
            currentUser = username;
            
            const saved = localStorage.getItem(`rpg_origin_${currentUser}`);
            if (saved) {
                state = JSON.parse(saved);
                // Schema migrations
                if(state.gems === undefined) state.gems = 0;
                if(!state.history) state.history = [];
                if(!state.inventory) state.inventory = [];
                if(state.equippedId === undefined) state.equippedId = null;
            } else {
                state = JSON.parse(JSON.stringify(defaultState));
            }

            checkDailyReset();

            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('app').style.display = 'flex';
            
            updateUI();
            renderHistory();
            renderInventory();
            renderTasks();
            renderOffers();
        }

        function saveState() {
            if (currentUser && state) {
                localStorage.setItem(`rpg_origin_${currentUser}`, JSON.stringify(state));
            }
            updateUI();
        }

        // Daily Reset Logic
        function checkDailyReset() {
            const todayStr = new Date().toISOString().split('T')[0];
            if (state.lastLoginDate !== todayStr) {
                state.lastLoginDate = todayStr;
                state.entriesToday = 0;
                // Reset daily tasks
                let t1 = state.tasks.find(t=>t.id===1);
                let t2 = state.tasks.find(t=>t.id===2);
                if(t1) { t1.completed = true; t1.claimed = false; } // Daily login auto-completes
                if(t2) { t2.completed = false; t2.claimed = false; }
            }
        }

        // UI Updates
        function updateUI() {
            // Level logic
            let currentLevelReq = state.level * EXP_PER_LEVEL;
            while (state.exp >= currentLevelReq) {
                state.level++;
                state.exp -= currentLevelReq;
                currentLevelReq = state.level * EXP_PER_LEVEL;
                showToast(`🌟 境界突破！達到 LV.${state.level}！`);
            }
            
            document.getElementById('level-display').innerText = `LV.${state.level} (${state.exp}/${currentLevelReq} XP)`;
            document.getElementById('title-display').innerText = currentUser;
            document.getElementById('coin-display').innerText = state.coins;
            document.getElementById('gem-display').innerText = state.gems;

            let expPercent = (state.exp / currentLevelReq) * 100;
            document.getElementById('exp-bar').style.width = `${expPercent}%`;
            
            // Update equipped icon in inventory page
            let eqItem = GACHA_POOL.find(i => i.id === state.equippedId);
            if(eqItem) {
                document.getElementById('eq-icon').innerText = eqItem.icon;
                document.getElementById('eq-name').innerText = eqItem.name;
                document.getElementById('eq-bonus').innerText = `加成：+${eqItem.bonus * 100}% 🪙`;
            }
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.innerText = msg;
            toast.style.opacity = 1;
            setTimeout(() => toast.style.opacity = 0, 2500);
        }

        function switchPage(pageId, navItem) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById(`page-${pageId}`).classList.add('active');
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            navItem.classList.add('active');
        }

        // --- Core Accounting ---
        function selectCat(btn, cat) {
            document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('selected'));
            btn.classList.add('selected');
            currentCat = cat;
        }

        function inputNum(val) {
            if (val === 'C') {
                currentAmount = "0";
            } else if (val === 'Enter') {
                let amt = parseInt(currentAmount, 10);
                if (amt <= 0 || isNaN(amt)) {
                    showToast('請輸入大於 0 的金額！');
                    return;
                }
                
                processAccounting(amt);
                currentAmount = "0";
            } else {
                if (currentAmount === "0") currentAmount = val;
                else if (currentAmount.length < 7) currentAmount += val;
            }
            document.getElementById('amount-input').innerText = currentAmount;
        }

        function processAccounting(amt) {
            // Check Daily tasks
            checkDailyReset();
            state.entriesToday++;
            
            let t2 = state.tasks.find(t=>t.id===2);
            if(t2 && !t2.completed && state.entriesToday >= 3) {
                t2.completed = true;
                showToast('📜 達成任務：勤勉記帳！');
            }

            // Calculate Base + Bonus Rewards
            let baseReward = 50;
            let eqItem = GACHA_POOL.find(i => i.id === state.equippedId);
            let multiplier = eqItem ? (1 + eqItem.bonus) : 1;
            let finalReward = Math.floor(baseReward * multiplier);
            
            state.coins += finalReward;
            state.exp += 10;
            
            // Add to history
            const timeStr = new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
            state.history.unshift({ cat: currentCat, amt: amt, time: timeStr, reward: finalReward });
            if(state.history.length > 10) state.history.pop(); // Keep last 10

            saveState();
            renderHistory();
            renderTasks();
            triggerRandomEvent();
        }

        // --- Exploration Event System ---
        function triggerRandomEvent() {
            const logContainer = document.getElementById('adventure-log');
            
            // Remove old entries if too many
            if(logContainer.children.length > 3) {
                logContainer.removeChild(logContainer.firstChild);
            }

            // Pick random event
            const ev = EVENTS[Math.floor(Math.random() * EVENTS.length)];
            
            // Apply event rewards
            if(ev.coins) state.coins += ev.coins;
            if(ev.exp) state.exp += ev.exp;
            
            // Create log element
            const entry = document.createElement('div');
            entry.className = 'log-entry';
            if(ev.type === 'Good' || ev.type === 'Epic') entry.classList.add('log-epic');
            
            entry.innerText = `[推進] ${ev.text}`;
            logContainer.appendChild(entry);
            
            saveState(); // save any extra rewards
        }

        function renderHistory() {
            const list = document.getElementById('history-list');
            list.innerHTML = '';
            if(state.history.length === 0) {
                list.innerHTML = '<div style="text-align:center; color:var(--text-dim); font-size:12px;">尚無冒險紀錄</div>';
                return;
            }
            state.history.forEach(h => {
                const item = document.createElement('div');
                item.className = 'history-item glass-panel';
                item.innerHTML = `
                    <span>${h.cat} 消耗 $${h.amt} <span style="font-size:10px; color:var(--text-dim);">(${h.time})</span></span>
                    <span style="color:var(--text-gold);">+${h.reward} 🪙</span>
                `;
                list.appendChild(item);
            });
        }

        // --- Tasks System (💎 Rewards) ---
        function renderTasks() {
            const list = document.getElementById('task-list');
            list.innerHTML = '';
            state.tasks.forEach(t => {
                const card = document.createElement('div');
                card.className = 'task-card glass-panel';
                
                let btnHTML = '';
                if (t.claimed) btnHTML = `<button class="btn-claim" disabled>已領取</button>`;
                else if (t.completed) btnHTML = `<button class="btn-claim" onclick="claimTask(${t.id})">領取</button>`;
                else btnHTML = `<span style="color:var(--text-dim); font-size:12px;">進行中</span>`;

                card.innerHTML = `
                    <div>
                        <h3 style="font-size:16px;">${t.title}</h3>
                        <p style="font-size:12px; color:var(--text-dim);">${t.desc}</p>
                        <div class="task-reward">🎁 ${t.rewardGems} 💎</div>
                    </div>
                    <div>${btnHTML}</div>
                `;
                list.appendChild(card);
            });
        }

        function claimTask(id) {
            let task = state.tasks.find(t => t.id === id);
            if(task && task.completed && !task.claimed) {
                task.claimed = true;
                state.gems += task.rewardGems; // Add Gems!
                showToast(`🎉 獲得 ${task.rewardGems} 💎 兌換點數！`);
                saveState();
                renderTasks();
            }
        }

        // --- Gacha / Market ---
        function drawGacha() {
            if(state.coins < 200) {
                showToast("🪙 遊戲幣不足！需要 200 🪙");
                return;
            }
            state.coins -= 200;
            
            // Simple random draw
            const item = GACHA_POOL[Math.floor(Math.random() * GACHA_POOL.length)];
            state.inventory.push(item.id);
            saveState();
            
            showToast(`🔮 法陣光芒閃爍... 獲得了【${item.name}】！`);
            renderInventory();
        }

        // --- Inventory ---
        function renderInventory() {
            const list = document.getElementById('inventory-list');
            list.innerHTML = '';
            if(state.inventory.length === 0) {
                list.innerHTML = '<div style="grid-column: span 2; text-align:center; color:var(--text-dim); font-size:12px;">行囊空空如也</div>';
                return;
            }
            
            // Deduplicate for display, count quantities
            let counts = {};
            state.inventory.forEach(id => counts[id] = (counts[id]||0) + 1);
            
            for(let idStr in counts) {
                let id = parseInt(idStr);
                let item = GACHA_POOL.find(i => i.id === id);
                let isEquipped = (state.equippedId === id);
                
                let div = document.createElement('div');
                div.className = `inv-item glass-panel ${isEquipped ? 'equipped' : ''}`;
                div.innerHTML = `
                    <div style="font-size:30px;">${item.icon}</div>
                    <div style="font-size:14px; font-weight:bold; margin-top:5px;">${item.name}</div>
                    <div style="font-size:12px; color:var(--text-gold);">加成: +${item.bonus*100}%</div>
                    <div style="font-size:10px; color:var(--text-dim);">數量: ${counts[idStr]}</div>
                    ${!isEquipped ? `<button class="inv-btn" onclick="equip(${item.id})">裝備</button>` : `<div style="font-size:12px; margin-top:10px; color:var(--text-gold);">已裝備</div>`}
                `;
                list.appendChild(div);
            }
        }
        
        function equip(id) {
            state.equippedId = id;
            saveState();
            renderInventory();
            showToast("🗡️ 裝備已更換！");
        }

        // --- Temple / Offers ---
        function renderOffers() {
            const list = document.getElementById('offer-list');
            list.innerHTML = '';
            state.offers.forEach(o => {
                const card = document.createElement('div');
                card.className = 'offer-card glass-panel';
                card.innerHTML = `
                    <div style="font-size:40px; background:rgba(0,0,0,0.5); border-radius:10px; padding:5px;">${o.icon}</div>
                    <div style="flex:1;">
                        <h3 style="font-size:16px;">${o.title}</h3>
                        <p style="font-size:12px; color:#e74c3c; margin-top:4px;">💰 ${o.cost} 💎</p>
                    </div>
                    <button class="btn-redeem" onclick="redeemCoupon(${o.id})">獻祭</button>
                `;
                list.appendChild(card);
            });
        }

        function redeemCoupon(id) {
            let offer = state.offers.find(o => o.id === id);
            if(state.gems >= offer.cost) {
                state.gems -= offer.cost; // Deduct GEMS
                saveState();
                openModal(offer);
            } else {
                showToast(`💎 兌換點數不足！需要 ${offer.cost} 💎`);
            }
        }

        // Modal
        function openModal(offer) {
            document.getElementById('modal-coupon-title').innerText = offer.title;
            const modal = document.getElementById('coupon-modal');
            modal.style.display = 'flex';
            
            const qrContainer = document.getElementById('qrcode');
            qrContainer.innerHTML = '<img src="qrcode_image.jpg" alt="QR" style="width:150px; border-radius:8px; object-fit:cover;">';

            let timeleft = 180;
            updateTimerDisplay(timeleft);
            
            if(timerInterval) clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                timeleft--;
                if(timeleft <= 0) {
                    clearInterval(timerInterval);
                    closeModal();
                    showToast('⚠️ 恩賜已消散！');
                } else updateTimerDisplay(timeleft);
            }, 1000);
        }

        function updateTimerDisplay(secs) {
            let m = Math.floor(secs / 60).toString().padStart(2, '0');
            let s = (secs % 60).toString().padStart(2, '0');
            document.getElementById('modal-timer').innerText = `${m}:${s}`;
        }

        function closeModal() {
            document.getElementById('coupon-modal').style.display = 'none';
            if(timerInterval) clearInterval(timerInterval);
            renderOffers();
        }

        // Handle Enter key in login
        document.getElementById('username-input').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') login();
        });

    </script>
</body>
</html>
